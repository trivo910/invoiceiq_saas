# Local development only. These database credentials are disposable examples.
x-app-environment: &app-environment
  APP_ENV: local
  APP_DEBUG: "true"
  APP_URL: http://localhost:8080
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: "3306"
  DB_DATABASE: invoiceiq
  DB_USERNAME: invoiceiq
  DB_PASSWORD: invoiceiq_local_password

services:
  app:
    build: .
    image: invoiceiq-local:latest
    env_file: .env.docker
    environment: *app-environment
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: invoiceiq
      MYSQL_USER: invoiceiq
      MYSQL_PASSWORD: invoiceiq_local_password
      MYSQL_ROOT_PASSWORD: invoiceiq_local_root_password
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  scheduler:
    profiles: ["scheduler"]
    image: invoiceiq-local:latest
    env_file: .env.docker
    environment: *app-environment
    user: www-data
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

volumes:
  app-storage:
  mysql-data:
